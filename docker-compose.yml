version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: heritage-postgres
    environment:
      POSTGRES_DB: heritage_db
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - heritage-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.0-community
    container_name: heritage-neo4j
    environment:
      NEO4J_AUTH: neo4j/heritage123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Web界面
      - "7687:7687"  # Bolt协议
    volumes:
      - neo4jdata:/data
    networks:
      - heritage-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p heritage123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heritage-backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=heritage
      - POSTGRES_PASSWORD=heritage123
      - POSTGRES_DB=heritage_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=heritage123
      - NEO4J_DATABASE=neo4j
      - AI_PROVIDER=dashscope
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # 知识图谱子系统（文件库 / 文本解析 / 图谱构建）
      - KG_STORAGE_DIR=/app/data/kg
      - KG_MAX_UPLOAD_MB=200
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      # 语音转写（腾讯云 FlashRecognizer）
      - TENCENT_APP_ID=${TENCENT_APP_ID:-}
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
      - ASR_ENGINE_TYPE=16k_zh
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - heritage-net

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heritage-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - heritage-net

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: heritage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - heritage-net

volumes:
  pgdata:
  neo4jdata:

networks:
  heritage-net:
    driver: bridge
